---
name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

# Poison AWS credentials workflow-wide so no job can accidentally reach real
# AWS infrastructure. Any boto3 or aws-cli call will fail fast rather than
# silently hitting the real account. /dev/null blocks file-based auth.
env:
  AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
  AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  AWS_SESSION_TOKEN: ""
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  AWS_CONFIG_FILE: /dev/null

jobs:
  lint-python:
    name: Python — ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  lint-shell:
    name: Shell — shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

      - name: Install shfmt
        run: |
          curl -Lo /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: shfmt
        run: shfmt -d -i 4 -ci setup.sh deploy.sh cleanup-dryrun.sh teardown.sh

  lint-yaml:
    name: YAML — yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Lint rendered policy YAML
        run: |
          uv run render-policy.py --account-id 123456789012 | uv run yamllint -c .yamllint.yml -
          uv run render-policy.py --account-id 123456789012 --dryrun | uv run yamllint -c .yamllint.yml -
      - name: Lint workflow YAML files
        run: uv run yamllint -c .yamllint.yml .github/workflows/

  test:
    name: Tests — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest tests/ -v
